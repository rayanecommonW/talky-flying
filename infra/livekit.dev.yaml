# Local development. Matches the defaults in apps/game/src/config.ts and apps/radio.
port: 7880
bind_addresses: ["127.0.0.1"]
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
  node_ip: 127.0.0.1
keys:
  devkey: secret
room:
  empty_timeout: 30
  departure_timeout: 10
logging:
  level: info
