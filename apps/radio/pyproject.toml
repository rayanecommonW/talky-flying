[project]
name = "dead-air-radio"
version = "0.1.0"
description = "AI radio hosts for DEAD AIR: one LiveKit agent per on-air FM station"
requires-python = ">=3.12,<3.15"
dependencies = [
  "livekit-agents>=1.8,<2",
  "livekit>=1.0",
  "livekit-api>=1.0",
  "anthropic>=0.80",
  "httpx>=0.28",
  "numpy>=2.0",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
